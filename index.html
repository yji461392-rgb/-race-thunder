<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RACE THUNDER</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  overflow:hidden;
  background:#071018;
  font-family:Arial,sans-serif;
  touch-action:none;
}
canvas{
  width:100vw;
  height:100vh;
  display:block;
}

#hud{
 position:fixed;
 top:12px;
 left:12px;
 right:12px;
 display:flex;
 justify-content:space-between;
 color:#fff;
 font-weight:900;
 font-size:14px;
 text-shadow:0 2px 5px #000;
}

#controls{
 position:fixed;
 bottom:18px;
 left:0;
 right:0;
 display:flex;
 justify-content:space-between;
 padding:0 18px;
}

.ctrl{
 border:1px solid #ffffff33;
 border-radius:18px;
 padding:17px 24px;
 background:#101b28dd;
 color:white;
 font-size:20px;
 font-weight:900;
 box-shadow:0 5px 20px #0008;
}

#nitro{
 background:#009dffdd;
}

#menu,#over{
 position:fixed;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#000b;
}

.box{
 width:85%;
 max-width:410px;
 padding:30px;
 border-radius:25px;
 background:#08131eF2;
 color:white;
 text-align:center;
 box-shadow:0 20px 70px #000;
}

.logo{
 font-size:42px;
 font-weight:1000;
 letter-spacing:2px;
}

.logo span{
 color:#ffc928;
}

.small{
 color:#9db1bf;
}

.mainbtn{
 width:100%;
 margin-top:18px;
 padding:16px;
 border:0;
 border-radius:14px;
 background:#ffc928;
 color:#111;
 font-weight:900;
 font-size:17px;
}

#nitrobar{
 position:fixed;
 left:12px;
 bottom:95px;
 width:145px;
 height:12px;
 border-radius:10px;
 background:#222c;
 overflow:hidden;
}

#nitrofill{
 width:100%;
 height:100%;
 background:#19b9ff;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
 <span id="speed">0 KM/H</span>
 <span>LEVEL 1 • CITY RUN</span>
 <span id="coinText">🪙 0</span>
</div>

<div id="nitrobar">
 <div id="nitrofill"></div>
</div>

<div id="controls">
 <button class="ctrl" id="left">◀</button>
 <button class="ctrl" id="nitro">⚡</button>
 <button class="ctrl" id="right">▶</button>
</div>

<div id="menu">
 <div class="box">
  <div class="logo">RACE <span>THUNDER</span></div>
  <p class="small">ORIGINAL MOBILE RACING</p>
  <p>🏙️ CITY RUN • LEVEL 1</p>
  <button class="mainbtn" onclick="startGame()">START RACE</button>
 </div>
</div>

<div id="over" style="display:none">
 <div class="box">
  <div class="logo">RACE OVER</div>
  <p id="result"></p>
  <button class="mainbtn" onclick="location.reload()">RESTART</button>
 </div>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
let lane=1;
let running=false;

let baseSpeed=8;
let speed=8;

let coins=0;
let score=0;

let nitroPower=100;
let nitroActive=false;

let traffic=[];
let coinObjects=[];

let spawnTimer=0;
let coinTimer=0;

function resize(){

 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;

}

resize();

window.addEventListener("resize",resize);


/* ---------------- CONTROLS ---------------- */

function moveLeft(){
 lane--;
 if(lane<0)lane=0;
}

function moveRight(){
 lane++;
 if(lane>2)lane=2;
}

left.addEventListener("pointerdown",moveLeft);
right.addEventListener("pointerdown",moveRight);

nitro.addEventListener("pointerdown",()=>{
 if(nitroPower>5){
   nitroActive=true;
 }
});

window.addEventListener("pointerup",()=>{
 nitroActive=false;
});


/* ---------------- CAR ---------------- */

function drawCar(x,y,color){

 const w=W*.14;
 const h=H*.16;

 /* shadow */
 ctx.fillStyle="#0008";
 ctx.beginPath();
 ctx.ellipse(x,y+h*.45,w*.55,h*.15,0,0,Math.PI*2);
 ctx.fill();

 /* body */
 ctx.fillStyle="#080b0e";
 ctx.beginPath();
 ctx.roundRect(
   x-w/2,
   y-h/2,
   w,
   h,
   16
 );
 ctx.fill();

 /* main body */
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(
   x-w*.40,
   y-h*.46,
   w*.80,
   h*.65,
   13
 );
 ctx.fill();

 /* roof */
 ctx.fillStyle="#111c25";
 ctx.beginPath();
 ctx.roundRect(
   x-w*.27,
   y-h*.34,
   w*.54,
   h*.25,
   10
 );
 ctx.fill();

 /* glass */
 ctx.fillStyle="#8eddf2";
 ctx.globalAlpha=.8;
 ctx.beginPath();
 ctx.roundRect(
   x-w*.22,
   y-h*.31,
   w*.44,
   h*.16,
   6
 );
 ctx.fill();
 ctx.globalAlpha=1;

 /* lights */
 ctx.fillStyle="#ff3434";
 ctx.fillRect(
   x-w*.30,
   y+h*.25,
   w*.18,
   h*.07
 );

 ctx.fillRect(
   x+w*.12,
   y+h*.25,
   w*.18,
   h*.07
 );

 /* wheels */
 ctx.fillStyle="#050505";

 ctx.fillRect(
   x-w*.55,
   y-h*.30,
   w*.14,
   h*.30
 );

 ctx.fillRect(
   x+w*.41,
   y-h*.30,
   w*.14,
   h*.30
 );

 ctx.fillRect(
   x-w*.55,
   y+h*.08,
   w*.14,
   h*.30
 );

 ctx.fillRect(
   x+w*.41,
   y+h*.08,
   w*.14,
   h*.30
 );

}


/* ---------------- WORLD ---------------- */

function drawWorld(){

 /* sky */

 let sky=ctx.createLinearGradient(0,0,0,H*.6);

 sky.addColorStop(0,"#1b5f88");
 sky.addColorStop(.55,"#73c6ec");
 sky.addColorStop(1,"#d9f1fa");

 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H*.6);


 /* distant buildings */

 for(let x=0;x<W;x+=75){

   let height=60+(x*17%140);

   ctx.fillStyle=
     x%150===0
     ? "#274d62"
     : "#345e70";

   ctx.fillRect(
     x,
     H*.55-height,
     55,
     height
   );

 }


 /* ground */

 ctx.fillStyle="#1d2a26";
 ctx.fillRect(
   0,
   H*.55,
   W,
   H*.45
 );


 /* road */

 const roadX=W*.18;
 const roadW=W*.64;

 ctx.fillStyle="#2e3237";

 ctx.fillRect(
   roadX,
   H*.55,
   roadW,
   H*.45
 );


 /* road edges */

 ctx.fillStyle="#ffc928";

 ctx.fillRect(
   roadX,
   H*.55,
   6,
   H*.45
 );

 ctx.fillRect(
   roadX+roadW-6,
   H*.55,
   6,
   H*.45
 );


 /* lane lines */

 ctx.fillStyle="#e8e8e8";

 const offset=(performance.now()/7)%100;

 for(
   let y=H*.55-offset;
   y<H;
   y+=100
 ){

   ctx.fillRect(
     roadX+roadW/3-4,
     y,
     8,
     52
   );

   ctx.fillRect(
     roadX+roadW*2/3-4,
     y,
     8,
     52
   );

 }

}


/* ---------------- GAME ---------------- */

function startGame(){

 document.getElementById("menu").style.display="none";

 running=true;

 requestAnimationFrame(loop);

}


function spawnTraffic(){

 traffic.push({

   lane:Math.floor(Math.random()*3),

   y:H*.52,

   color:[
     "#e54838",
     "#20b86b",
     "#8b55ff",
     "#eeeeee"
   ][Math.floor(Math.random()*4)]

 });

}


function spawnCoin(){

 coinObjects.push({

   lane:Math.floor(Math.random()*3),

   y:H*.52

 });

}


function loop(){

 if(!running)return;

 ctx.clearRect(0,0,W,H);

 drawWorld();


 /* nitro */

 if(nitroActive && nitroPower>0){

   speed=18;

   nitroPower-=.8;

 }else{

   speed=baseSpeed;

   nitroPower=Math.min(
     100,
     nitroPower+.12
   );

 }


 /* traffic spawn */

 spawnTimer--;

 if(spawnTimer<=0){

   spawnTimer=45+Math.random()*35;

   spawnTraffic();

 }


 /* coin spawn */

 coinTimer--;

 if(coinTimer<=0){

   coinTimer=35+Math.random()*45;

   spawnCoin();

 }


 const roadX=W*.18;
 const roadW=W*.64;

 const playerX=
   roadX+
   roadW*(lane+.5)/3;

 const playerY=H*.80;


 /* traffic */

 for(let i=traffic.length-1;i>=0;i--){

   const t=traffic[i];

   t.y+=speed;

   const x=
     roadX+
     roadW*(t.lane+.5)/3;

   drawCar(
     x,
     t.y,
     t.color
   );


   if(
     Math.abs(x-playerX)<W*.075 &&
     Math.abs(t.y-playerY)<H*.075
   ){

     running=false;

     document.getElementById("result").textContent=
       "Score: "+score+
       " • Coins: "+coins;

     document.getElementById("over").style.display="flex";

   }


   if(t.y>H){

     traffic.splice(i,1);

   }

 }


 /* coins */

 for(let i=coinObjects.length-1;i>=0;i--){

   const o=coinObjects[i];

   o.y+=speed;

   const x=
     roadX+
     roadW*(o.lane+.5)/3;

   ctx.fillStyle="#ffd329";

   ctx.beginPath();

   ctx.arc(
     x,
     o.y,
     15,
     0,
     Math.PI*2
   );

   ctx.fill();

   ctx.fillStyle="#8a6200";

   ctx.font="bold 15px Arial";

   ctx.fillText(
     "$",
     x-5,
     o.y+5
   );


   if(
     Math.abs(x-playerX)<W*.08 &&
     Math.abs(o.y-playerY)<H*.08
   ){

     coins++;
     score+=100;

     coinObjects.splice(i,1);

   }


   if(o.y>H){

     coinObjects.splice(i,1);

   }

 }


 /* player */

 drawCar(
   playerX,
   playerY,
   "#147cff"
 );


 /* nitro flame */

 if(nitroActive){

   ctx.fillStyle="#20cfff";

   ctx.beginPath();

   ctx.moveTo(
     playerX-W*.025,
     playerY+H*.08
   );

   ctx.lineTo(
     playerX,
     playerY+H*.19
   );

   ctx.lineTo(
     playerX+W*.025,
     playerY+H*.08
   );

   ctx.fill();

 }


 score++;

 baseSpeed=Math.min(
   14,
   baseSpeed+.001
 );


 document.getElementById("speed").textContent=
   Math.round(speed*18)+" KM/H";

 document.getElementById("coinText").textContent=
   "🪙 "+coins;

 document.getElementById("nitrofill").style.width=
   nitroPower+"%";


 requestAnimationFrame(loop);

}

</script>

</body>
</html>
